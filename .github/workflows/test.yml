name: Verify Cloudflare group 2.2 bot

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check safe deduplication and Telegram formatting
        run: npm test
      - name: Check Cloudflare Worker bundle
        run: npm run check
